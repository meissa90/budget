<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطة المصاريف</title>
<meta name="theme-color" content="#f7f9f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="الميزانية">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16252d; --muted:#5b6b72; --paper:#f7f9f8; --card:#ffffff; --line:#d8e1df;
  --teal:#0e6b6b; --teal-soft:#e2f0ef; --amber:#a86f00; --amber-soft:#fbf0d9;
  --red:#b3261e; --red-soft:#fbe5e3; --green:#2d7a3a;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6eeec; --muted:#9aaaa8; --paper:#0f1719; --card:#172226; --line:#2a3a3e;
    --teal:#5cc2bd; --teal-soft:#16302f; --amber:#e3aa3a; --amber-soft:#33280f;
    --red:#ff8a80; --red-soft:#3a1c1a; --green:#7fcf8a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e6eeec; --muted:#9aaaa8; --paper:#0f1719; --card:#172226; --line:#2a3a3e;
  --teal:#5cc2bd; --teal-soft:#16302f; --amber:#e3aa3a; --amber-soft:#33280f;
  --red:#ff8a80; --red-soft:#3a1c1a; --green:#7fcf8a;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 64px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.9rem;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px;max-width:70ch}
.save{font-size:.85rem;color:var(--muted)}
.lang{font:inherit;font-weight:600;background:var(--card);color:var(--teal);border:1px solid var(--teal);border-radius:6px;padding:6px 14px;cursor:pointer;flex:0 0 auto;margin-top:6px}

.totals{display:grid;grid-template-columns:2fr 1fr 1fr;border:2px solid var(--ink);background:var(--card);margin:18px 0 26px}
.totals>div{padding:16px 18px;border-inline-start:1px solid var(--line)}
.totals>div:first-child{border-inline-start:0}
.totals .lbl{font-size:.85rem;color:var(--muted)}
.totals .big{font-size:2.4rem;font-weight:700;line-height:1.15}
.totals .mid{font-size:1.5rem;font-weight:600;line-height:1.2}
.delta{font-size:.85rem}
.delta.neg{color:var(--red)} .delta.pos{color:var(--green)}
@media (max-width:720px){.totals{grid-template-columns:1fr 1fr}.totals>div:first-child{grid-column:1/-1;border-bottom:1px solid var(--line)}}

.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px}
.mbtn{flex:0 0 auto;min-width:96px;text-align:start;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;cursor:pointer}
.mbtn small{display:block;color:var(--muted);font-size:.75rem}
.mbtn b{font-weight:600}
.mbtn[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 -3px 0 var(--teal)}
.mbtn.tight b{color:var(--amber)} .mbtn.bad b{color:var(--red)}
.mbtn.changed::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-inline-start:6px;vertical-align:middle}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
.note{background:var(--teal-soft);border-radius:6px;padding:10px 12px;margin:0 0 14px}
.warn{background:var(--red-soft);color:var(--red);border-radius:6px;padding:10px 12px;margin:0 0 14px;font-weight:500}
.caution{background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:10px 12px;margin:0 0 14px}

.ledger{width:100%;border-collapse:collapse}
.ledger td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.ledger td:last-child{text-align:end;white-space:nowrap;padding-inline-start:12px}
.ledger .why{display:block;color:var(--muted);font-size:.8rem}
.ledger tr.sec td{border-bottom:0;padding-top:12px;font-weight:600;color:var(--muted);font-size:.85rem}
.ledger tr.extra td{color:var(--red)}
.ledger tr.extrain td{color:var(--green)}
.ledger tr.result td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700;padding-top:10px}
.ledger tr.bal td{border-bottom:0;font-weight:600}

label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input[type=number]{direction:ltr;text-align:right}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn{font:inherit;font-weight:600;background:var(--teal);color:var(--card);border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn.link{background:none;color:var(--muted);padding:0;font-weight:400;text-decoration:underline;border:0;cursor:pointer;font:inherit;font-size:.85rem}
.entries{list-style:none;margin:12px 0 0;padding:0}
.entries li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:8px 0}
.entries .meta{color:var(--muted);font-size:.8rem;display:block}
.empty{color:var(--muted);font-size:.9rem}
.err{color:var(--red);font-size:.85rem;min-height:1.2em;margin:6px 0 0}

.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.9rem;margin-bottom:6px;cursor:pointer}
.chk input{width:auto;margin:0}
.ed{display:grid;grid-template-columns:1fr 128px;gap:2px 10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.ed label{margin:0;color:var(--ink);font-size:.9rem}
.ed input{padding:5px 8px}
.ed.chg input{border-color:var(--amber);background:var(--amber-soft)}
.ed .pl{grid-column:1/-1;font-size:.78rem;color:var(--amber);display:flex;gap:10px;align-items:center}
.edh{font-weight:600;color:var(--muted);font-size:.85rem;padding-top:12px}
.tablewrap{overflow-x:auto}
table.all{width:100%;border-collapse:collapse;min-width:640px;background:var(--card)}
table.all th,table.all td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
table.all th{font-size:.8rem;color:var(--muted);font-weight:500}
table.all td.n{text-align:end}
table.all tr.sel td{background:var(--teal-soft)}
table.all .bad{color:var(--red);font-weight:600} table.all .tight{color:var(--amber);font-weight:600}
section{margin-top:28px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
details table{margin-top:10px}
details p{max-width:75ch}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:28px;color:var(--muted);font-size:.85rem}
[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hd{flex:1 1 420px}
.hd .sub{margin-bottom:6px}
.ctrls{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ctrls .lang{margin-top:0}
.ctl{display:flex;align-items:center;gap:8px}
.ctll{font-size:.8rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--card)}
.seg button{font:inherit;font-size:.85rem;background:none;border:0;color:var(--muted);padding:4px 10px;border-radius:5px;cursor:pointer}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--teal);color:var(--card)}
.seg.wide{display:flex;margin-bottom:16px}
.seg.wide button{flex:1;padding:7px 10px;font-size:.9rem}
.sw{display:flex;gap:7px}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal);font-weight:600}
.narrow{max-width:600px}
table.all tr.click{cursor:pointer}
table.all tr.click:hover td{background:var(--teal-soft)}
@media (max-width:640px){.ctrls{align-items:flex-start;width:100%}}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.hhead h2{margin:0}
.hsel{width:auto}
.hbar{height:10px;background:var(--teal-soft);border-radius:5px;overflow:hidden;margin-bottom:12px}
.hbar div{height:100%;background:var(--teal);width:0;transition:width .3s}
.hbar.over div{background:var(--red)}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.hstats .lbl{display:block;font-size:.8rem;color:var(--muted)}
.hstats b{font-size:1.25rem;font-weight:600}
#hPhotoBtn{width:100%;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.tag{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-inline-start:6px}
@media (prefers-reduced-motion:reduce){.hbar div{transition:none}}
.gate{max-width:460px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
.gate h2{font-size:1.3rem}
.gate .btn{margin-top:6px}
.who{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* ---------- mobile / iPhone ---------- */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:40;pointer-events:none}
html{-webkit-text-size-adjust:100%}
button,select,input,summary,.mbtn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.iconbtn{font:inherit;font-weight:600;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;cursor:pointer;padding:0 10px}
.top{align-items:center;flex-wrap:nowrap}
.muted{color:var(--muted);font-size:.85rem}
.sheet{border:0;border-radius:16px;padding:18px;width:min(460px,calc(100% - 24px));background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet::backdrop{background:rgba(0,0,0,.35)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-h h2{margin:0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.srow.col{flex-direction:column;align-items:stretch}
.srow .lang{margin:0;min-height:40px}
.danger{color:var(--red)!important}
.tabs button{display:flex;align-items:center;gap:6px}
input,select{min-height:44px}
.ed input{min-height:40px}
.btn{min-height:44px}
.btn.link{min-height:36px;padding:4px 2px}
.months{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mbtn{scroll-snap-align:center}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:12px 14px calc(84px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.45rem}
  .hd .sub{display:none}
  input,select,textarea{font-size:16px}
  .totals{margin:12px 0 14px;grid-template-columns:1fr 1fr}
  .totals>div{padding:12px}
  .totals .big{font-size:2rem}
  .totals .mid{font-size:1.2rem}
  .panel{padding:14px;border-radius:12px}
  .grid{gap:12px}
  .row{gap:8px}
  .tabs{position:fixed;inset:auto 0 0 0;z-index:20;margin:0;border:0;border-top:1px solid var(--line);background:var(--card);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:0;justify-content:space-around;overflow:visible}
  .tabs button{flex:1;flex-direction:column;gap:2px;padding:6px 2px;border-bottom:0;font-size:.72rem;min-height:52px;border-radius:10px}
  .tabs button[aria-selected="true"]{color:var(--teal);background:var(--teal-soft)}
  .ledger td{padding:8px 0}
  .entries li{padding:10px 0}
  table.all{min-width:0}
  table.all .opt{display:none}
  table.all th,table.all td{padding:10px 6px;font-size:.92rem}
  table.all th{white-space:normal;font-size:.75rem;vertical-align:bottom}
  #pane-house .grid>.panel:last-child{order:-1}
  #hPhotoBtn{min-height:56px;font-size:1.05rem}
  #hAdd,#fAdd{width:100%}
  body[data-tab="house"] .hero,body[data-tab="raise"] .hero,body[data-tab="plan"] .hero{display:none}
  .hstats b{font-size:1.1rem}
  .ed{grid-template-columns:1fr 110px}
  .seg.wide button{min-height:40px}
  details{padding:12px 14px}
  summary{min-height:32px;display:flex;align-items:center}
  .sheet{margin:auto auto 0;border-radius:18px 18px 0 0;width:100%;max-width:100%;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
}
/* ---------- polish & motion ---------- */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
.hero{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px;margin:16px 0 22px;overflow:hidden}
.hero .lbl{font-size:.85rem;color:var(--muted)}
.hero .big{font-size:3rem;font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:2px 0 8px}
.pill{display:inline-block;font-size:.78rem;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.pill.neg{background:var(--red-soft);color:var(--red)}
.pill.pos{background:var(--teal-soft);color:var(--green)}
.spark-wrap{margin:12px -18px 0;position:relative}
.spark{display:block;width:100%;height:110px;touch-action:pan-y;cursor:pointer}
.spark .area{fill:url(#sparkFill)}
.spark .line{fill:none;stroke:var(--teal);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark .plan{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4;opacity:.6;vector-effect:non-scaling-stroke}
.spark .zero{stroke:var(--red);stroke-width:1;opacity:.5;vector-effect:non-scaling-stroke}
.spark .cursor{stroke:var(--ink);stroke-width:1;opacity:.25;vector-effect:non-scaling-stroke}
.spark-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--teal);border:3px solid var(--card);box-shadow:0 0 0 1px var(--teal);transform:translate(-50%,-50%);pointer-events:none;transition:left .35s var(--ease),top .35s var(--ease)}
.spark-x{display:flex;justify-content:space-between;padding:4px 18px 0;font-size:.72rem;color:var(--muted)}
.spark-x #sxSel{color:var(--ink);font-weight:600}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.hero-stats b{display:block;font-size:1.3rem;font-weight:600;line-height:1.3}
.hero-stats .delta{font-size:.75rem}
.spark.draw .line{vector-effect:none;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:drawLine 1.1s var(--ease) .1s forwards}
.spark.draw .area{opacity:0;animation:fadeIn .6s ease .7s forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
.ring-row{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;margin:4px 0 14px}
.ring-wrap{position:relative;width:150px;height:150px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
[dir="rtl"] .ring{transform:rotate(-90deg) scaleY(-1)}
.ring-bg{fill:none;stroke:var(--teal-soft);stroke-width:12}
.ring-fg{fill:none;stroke:var(--teal);stroke-width:12;stroke-linecap:round;stroke-dasharray:314.16;stroke-dashoffset:314.16;transition:stroke-dashoffset .9s var(--ease),stroke .3s}
.ring-fg.warn{stroke:var(--amber)}.ring-fg.over{stroke:var(--red)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c .lbl{font-size:.75rem;color:var(--muted)}
.ring-c b{font-size:1.45rem;font-weight:700}
.ring-row .hstats{grid-template-columns:1fr;gap:8px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.95rem;z-index:60;pointer-events:none;transition:opacity .25s ease,transform .3s var(--ease);display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:641px){.toast{bottom:28px}}
.pane.enter{animation:paneIn .28s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn,.mbtn,.tabs button,.seg button,.iconbtn{transition:transform .12s ease,background-color .2s ease,color .2s ease,border-color .2s ease}
.btn:active,.mbtn:active,.iconbtn:active,.seg button:active{transform:scale(.96)}
.tabs button[aria-selected="true"] svg{animation:pop .35s var(--ease)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.sheet[open]{animation:sheetUp .32s var(--ease)}
.sheet[open]::backdrop{animation:fadeIn .25s ease forwards;opacity:0}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.entries li.new{animation:rowIn .45s var(--ease)}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px);background:var(--teal-soft)}to{opacity:1;transform:none;background:transparent}}
.mbtn[aria-pressed="true"]{background:var(--teal-soft)}
@media (max-width:640px){
  .hero{margin:10px 0 14px;padding:16px 16px 12px;border-radius:18px}
  .hero .big{font-size:2.6rem}
  .hero-stats{gap:6px}
  .hero-stats b{font-size:1.05rem}
  .hero-stats .lbl{font-size:.72rem;line-height:1.3;display:block;min-height:2.6em}
  .spark-wrap{margin:10px -16px 0}
  .spark-x{padding:4px 16px 0}
  .ring-row{grid-template-columns:132px 1fr;gap:12px}
  .ring-wrap{width:132px;height:132px}
  .ring-c b{font-size:1.25rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .spark.draw .line{stroke-dasharray:none;stroke-dashoffset:0}.spark.draw .area{opacity:1}
}
/* ---------- professional theme ---------- */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--paper:#f3f5f7;--card:#ffffff;--line:#e3e8ec;--ink:#0f1d26;--muted:#5f6f78;--accent-hi:#5cc2bd;
  --shadow:0 1px 2px rgba(15,29,38,.04),0 6px 20px rgba(15,29,38,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0a1116;--card:#111b21;--line:#1f2c33;--ink:#e8eef0;--muted:#8fa0a7;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--paper:#0a1116;--card:#111b21;--line:#1f2c33;--ink:#e8eef0;--muted:#8fa0a7;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
body{letter-spacing:-.003em}
h1{font-weight:700;letter-spacing:-.015em}
h2{font-weight:600;font-size:1.08rem}
.panel,details,table.all{border-color:var(--line);box-shadow:var(--shadow)}
.panel{border-radius:16px}
.mbtn{border-radius:12px;box-shadow:var(--shadow);border-color:transparent}
.iconbtn{box-shadow:var(--shadow);border-color:transparent;border-radius:12px}
/* statement card: dark in both modes */
.hero{--ink:#eef4f6;--muted:#93a6ad;--line:rgba(255,255,255,.09);--card:#13222b;
  color:var(--ink);background:radial-gradient(120% 140% at 100% 0%,#1a3440 0%,#12212a 45%,#0d181f 100%);border:0;box-shadow:0 10px 30px rgba(8,18,24,.25)}
.hero .pill{background:rgba(255,255,255,.08);color:var(--accent-hi)}
.hero .pill.neg{background:rgba(255,107,97,.15);color:#ff8a80}
.hero .pill.pos{color:#8be0a0}
.hero .delta.neg{color:#ff8a80}.hero .delta.pos{color:#8be0a0}
.hero .spark .line{stroke:var(--accent-hi)}
.hero .spark .area{fill:url(#sparkFill)}
.hero .spark-dot{background:var(--accent-hi);box-shadow:0 0 0 1px var(--accent-hi),0 0 14px var(--accent-hi)}
.spark .beam{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:60 940;stroke-dashoffset:1000;filter:drop-shadow(0 0 4px var(--accent-hi)) drop-shadow(0 0 8px var(--accent-hi));animation:beam 4.5s linear infinite;opacity:.9}
@keyframes beam{to{stroke-dashoffset:0}}
/* moving light border */
.glow{position:relative;isolation:isolate}
.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 62%,color-mix(in srgb,var(--accent-hi) 70%,transparent) 74%,#fff 80%,color-mix(in srgb,var(--accent-hi) 70%,transparent) 86%,transparent 98%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinAng 7s linear infinite}
#hPhotoBtn.glow::after{padding:2px;animation-duration:3.5s}
@keyframes spinAng{to{--ang:360deg}}
.mbtn[aria-pressed="true"]{position:relative;isolation:isolate;border-color:transparent;background:var(--teal-soft)}
.mbtn[aria-pressed="true"]::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),var(--teal) 0 55%,#fff 70%,var(--teal) 85%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinAng 5s linear infinite}
.mbtn[aria-pressed="true"]{box-shadow:0 6px 18px color-mix(in srgb,var(--teal) 22%,transparent)}
/* light line running across the nav */
@media (min-width:641px){.tabs{position:relative}}
.navlight{position:absolute;inset:0 0 auto 0;height:1.5px;overflow:hidden;pointer-events:none}
.navlight::before{content:"";position:absolute;top:0;width:35%;height:100%;background:linear-gradient(90deg,transparent,var(--accent-hi),#fff,var(--accent-hi),transparent);animation:navRun 5s ease-in-out infinite;left:-35%}
@keyframes navRun{0%{left:-35%}60%,100%{left:100%}}
@media (min-width:641px){.navlight{inset:auto 0 -1px 0}}
.tabs button[aria-selected="true"]{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--teal) 25%,transparent)}
.btn{box-shadow:0 1px 2px rgba(15,29,38,.08)}
.btn:not(.ghost):not(.link){background:linear-gradient(180deg,color-mix(in srgb,var(--teal) 88%,#fff),var(--teal))}
.ring-fg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--teal) 45%,transparent))}
.ring-shine{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-dasharray:6 308;opacity:.55;transform-box:fill-box;transform-origin:center;animation:ringRun 3.2s linear infinite}
@keyframes ringRun{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spark .beam,.navlight,.ring-shine{display:none}.glow::after,.mbtn[aria-pressed="true"]::before{animation:none}}
/* hero stats: align label, number and note on one edge */
.hero-stats{gap:0}
.hero-stats>div{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding-inline:12px;min-width:0}
.hero-stats>div:first-child{padding-inline-start:0}
.hero-stats>div:last-child{padding-inline-end:0}
.hero-stats>div+div{border-inline-start:1px solid var(--line)}
.hero-stats .lbl{display:block;min-height:0!important;font-size:.74rem;line-height:1.35;color:var(--muted)}
.hero-stats b{display:inline-block;font-size:1.2rem;font-weight:700;line-height:1.25;margin-top:2px}
.hero-stats .delta{font-size:.72rem;color:var(--muted)}
.hero-stats .delta.neg{color:#ff8a80}.hero-stats .delta.pos{color:#8be0a0}
@media (max-width:640px){.hero-stats>div{padding-inline:9px}.hero-stats b{font-size:1.05rem}.hero-stats .lbl{font-size:.7rem}}
.fix{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px;background:var(--paper)}
.fix h3{font-size:1rem;margin:0 0 6px}
.fix p{margin:6px 0}
.fix .opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.fix .opts .btn{min-height:40px;padding:6px 10px;flex:1;white-space:nowrap}
.fix #fixCard{width:100%}
.fixprev td{padding:6px 0}
.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.row>div{min-width:0}
details *,details *::before,details *::after{box-sizing:border-box}
details.pe{padding:0}
.pe>summary{padding:12px 16px}
.pe-body{display:block;padding:0 16px 16px}
.pe .row{margin-top:10px}
.pe #peApply{width:100%;margin-top:4px}
.bake{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.bake h3{font-size:1rem;margin:0 0 4px}
.bake .btn{width:100%}
.cats{margin:4px 0 14px}
.cats-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cats-h h3{font-size:1rem;margin:0}
.cat{padding:8px 0;border-bottom:1px dashed var(--line)}
.cat-top{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.cat-top .num{color:var(--muted);font-size:.85rem}
.cat-bar{height:6px;border-radius:3px;background:var(--teal-soft);margin:6px 0 4px;overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--teal);border-radius:3px;transition:width .6s var(--ease)}
.cat-bar.warn i{background:var(--amber)}.cat-bar.over i{background:var(--red)}
.cat-sub{font-size:.75rem;color:var(--muted)}.cat-sub.neg{color:var(--red)}
.cat-sum{margin:8px 0 0}
.cat-ed{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 14px;background:var(--paper)}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) 100px 44px;gap:8px;margin-bottom:8px}
.cat-row input{min-height:42px}
.cat-ed .opts{display:flex;gap:8px;margin-top:8px}
.cat-ed .opts .btn{flex:1}
.catsel{display:inline-block;width:auto;min-height:0;margin-top:4px;padding:2px 8px;font-size:.75rem;border-radius:999px;background:var(--teal-soft);color:var(--teal);border:0}
.hseg{margin-bottom:14px}
.sec-h{font-weight:600;color:var(--muted);font-size:.82rem;padding:14px 0 4px!important;border:0!important}
.inv{display:flex;flex-direction:column;align-items:stretch!important;gap:6px}
.inv-main{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.inv-name{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:start}
.chips{display:flex;gap:6px}
.chip{flex:1;font:inherit;font-size:.8rem;padding:6px 4px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;min-height:34px}
.chip.on.s-ok{background:var(--teal-soft);color:var(--teal);border-color:var(--teal)}
.chip.on.s-low{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.chip.on.s-out{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.inv-ed{display:block!important;background:var(--paper);border-radius:12px;padding:12px!important;margin:4px 0 8px}
.inv-ed .opts{display:flex;gap:8px}.inv-ed .opts .btn{flex:1}
.ssum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ssum .lbl{display:block;font-size:.74rem;color:var(--muted);min-height:2.4em}
.ssum b{font-size:1.2rem;font-weight:700}.ssum b.neg{color:var(--red)}
.rec-panel h3{font-size:1rem;margin:0 0 6px}
.rec{list-style:none;padding:0;margin:6px 0 10px}
.rec li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.rec li.rec-t{font-weight:700;border-bottom:0}
.rec.wait li{color:var(--muted)}
.rec-panel .btn{width:100%}
.shop{display:grid!important;grid-template-columns:minmax(0,1fr) 92px 32px;align-items:center;gap:8px}
.shop.done .chk span{text-decoration:line-through;color:var(--muted)}
.shop .chk{margin:0;align-items:center}
.shop .chk input{width:22px;height:22px;min-height:0}
.sprice{min-height:38px;padding:6px 8px}
.shop-add{margin-top:12px}
.shop-add .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
</style>
</head>

const $=id=>document.getElementById(id);
const t=()=>T[lang];
const tx=o=>o?(o[lang]??o.ar):"";
const fmt=n=>{const s=Math.abs(Math.round(n)).toLocaleString("en-US");return n<0?"−"+s:s};
const signed=n=>n>0?"+"+fmt(n):fmt(n);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const SRC_KEYS=["personal","emergency","school"];

/* ---------- plan config (loaded from Firestore) ---------- */
let CFG=null,N=0,FIXED_AMT=[],JAMS=[],BASE={},OKEYS=[],BASE_ROWS=[];
function setConfig(c){
  CFG=c;N=c.months.ar.length;FIXED_AMT=c.fixed.map(f=>+f.amount);JAMS=c.jams;BASE=c.base;
  OKEYS=["salary","extra","school","schoolX","special","personal","inst"].concat(FIXED_AMT.map((x,k)=>"fix"+k),JAMS.map((x,k)=>"jam"+k));
  BASE_ROWS=compute({entries:{},overrides:{},raise:null},[]);
}
const M=i=>tx(CFG.months)[i];
function validConfig(c){
  try{const n=c.months.ar.length;return n>0&&Array.isArray(c.fixed)&&Array.isArray(c.jams)&&["salary","extra","school","schoolX","special","personal","inst"].every(k=>Array.isArray(c.base[k])&&c.base[k].length===n)}catch(e){return false}
}
function jamActive(k,i){return i>=JAMS[k].s&&i<=JAMS[k].e}
function jamIdx(i){return JAMS.map((j,k)=>k).filter(k=>jamActive(k,i))}
function jamTotal(i){return jamIdx(i).reduce((a,k)=>a+planVal({raise:null},i,"jam"+k),0)}
function defaults(st,i){
  const R=st.raise;const rz=(R&&R.amount>0&&i>=R.from)?R.amount:0;
  let pAdd=0;
  if(rz){if(R.split==="personal")pAdd=rz;else if(R.split==="plan"&&i>=CFG.raiseSplitFrom)pAdd=Math.round(rz/2);}
  return {salary:BASE.salary[i]+rz,personal:BASE.personal[i]+pAdd,rz,pAdd};
}
function planVal(st,i,key){
  if(key==="salary"||key==="personal")return defaults(st,i)[key];
  if(key.startsWith("fix")){const f=CFG.fixed[+key.slice(3)];return Array.isArray(f.byMonth)&&Number.isFinite(+f.byMonth[i])?+f.byMonth[i]:FIXED_AMT[+key.slice(3)]}
  if(key.startsWith("jam")){const k=+key.slice(3);if(!jamActive(k,i))return 0;const bm=JAMS[k].byMonth;return Array.isArray(bm)&&bm[i]!=null&&Number.isFinite(+bm[i])?+bm[i]:JAMS[k].a}
  return BASE[key][i];
}
function isOv(st,i,key){const o=(st.overrides||{})[i]||{};return Number.isFinite(o[key])}
function val(st,i,key){const o=(st.overrides||{})[i]||{};return Number.isFinite(o[key])?o[key]:planVal(st,i,key)}
function compute(st,purch){
  purch=purch||[];
  let em=0,sch=CFG.schoolOpen;const rows=[];
  for(let i=0;i<N;i++){
    const o=(st.overrides||{})[i]||{};
    const d=defaults(st,i);
    const v=k=>val(st,i,k);
    const salary=v("salary"),personal=v("personal"),extra=v("extra"),school=v("school"),schoolX=v("schoolX"),special=v("special"),inst=v("inst");
    let fixTot=0;for(let k=0;k<FIXED_AMT.length;k++)fixTot+=v("fix"+k);
    let jam=0;for(const k of jamIdx(i))jam+=v("jam"+k);
    const ents=((st.entries||{})[i])||[];
    let inc=0,pers=0,emx=0,schx=0;
    for(const e of ents){
      if(e.type==="income")inc+=e.amount;
      else if(e.source==="personal")pers+=e.amount;
      else if(e.source==="school")schx+=e.amount;
      else emx+=e.amount;
    }
    const overflow=Math.max(0,pers-personal);
    const houseBudget=v("fix"+CFG.houseIdx);
    const houseSpent=purch.reduce((a,q)=>a+(q.month===i?q.amount:0),0);
    const houseOver=Math.max(0,houseSpent-houseBudget);
    const toEm=salary+extra+inc-fixTot-jam-school-schoolX-special-personal-emx-overflow-houseOver;
    em+=toEm;
    sch=sch+school+schoolX-schx-inst;
    rows.push({i,houseBudget,houseSpent,houseOver,salary,personal,extra,school,schoolX,special,inst,fixTot,rz:d.rz,pAdd:d.pAdd,inc,pers,emx,schx,overflow,jam,toEm,em,sch,personalLeft:Math.max(0,personal-pers),
      changed:ents.length>0||Object.keys(o).length>0});
  }
  return rows;
}
function monthOf(ds){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ds||""))return -1;
  const i=(+ds.slice(0,4)-CFG.startYear)*12+(+ds.slice(5,7))-CFG.startMonth;return(i>=0&&i<N)?i:-1;
}
function ymOf(i){const z=CFG.startMonth-1+i;return[CFG.startYear+Math.floor(z/12),(z%12)+1]}
const pad=n=>String(n).padStart(2,"0");
function isoToday(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function defaultDate(i){const td=isoToday();if(monthOf(td)===i)return td;const[y,m]=ymOf(i);return y+"-"+pad(m)+"-01"}
function lastDate(){const[y,m]=ymOf(N-1);return y+"-"+pad(m)+"-"+pad(new Date(y,m,0).getDate())}
function currentIdx(){return monthOf(isoToday())}

/* ---------- state ---------- */
let state={entries:{},overrides:{},raise:null,houseCats:{}};
let purchases=[];
let sel=0,hSel=0;
function stateDoc(st){return {entries:st.entries||{},overrides:st.overrides||{},raise:st.raise||null,houseCats:st.houseCats||{},updated:Date.now()}}
function sanitize(p){
  const out={entries:{},overrides:{},raise:null,houseCats:{}};
  if(p&&p.houseCats&&typeof p.houseCats==="object")for(const k of Object.keys(p.houseCats)){
    const i=+k;if(!(i>=0&&i<N)||!Array.isArray(p.houseCats[k]))continue;
    out.houseCats[i]=p.houseCats[k].filter(c=>c&&String(c.name||"").trim()).slice(0,30).map(c=>({id:String(c.id||Math.random().toString(36).slice(2,9)),name:String(c.name).trim().slice(0,30),amount:Math.max(0,Math.round(+c.amount||0))}));
  }
  if(p&&p.raise&&typeof p.raise==="object"){const R=p.raise;const a=Math.round(+R.amount),f=Math.round(+R.from);
    if(a>0&&f>=0&&f<N)out.raise={amount:a,from:f,split:["plan","emergency","personal"].includes(R.split)?R.split:"plan"};}
  if(p&&p.entries&&typeof p.entries==="object")for(const k of Object.keys(p.entries)){
    const i=+k;if(!(i>=0&&i<N)||!Array.isArray(p.entries[k]))continue;
    const arr=p.entries[k].filter(e=>e&&Number.isFinite(+e.amount)&&+e.amount>0).map(e=>({id:String(e.id||Math.random().toString(36).slice(2)),amount:+e.amount,note:String(e.note||"").slice(0,60),type:e.type==="income"?"income":"expense",source:SRC_KEYS.includes(e.source)?e.source:"personal"}));
    if(arr.length)out.entries[i]=arr;
  }
  if(p&&p.overrides&&typeof p.overrides==="object")for(const k of Object.keys(p.overrides)){
    const i=+k;if(!(i>=0&&i<N))continue;const o=p.overrides[k]||{};const r={};
    for(const key of OKEYS)if(Number.isFinite(+o[key])&&o[key]!==null&&+o[key]>=0)r[key]=Math.round(+o[key]);
    if(Object.keys(r).length)out.overrides[i]=r;
  }
  return out;
}

/* ---------- firebase ---------- */
const configured=!Object.values(FIREBASE_CONFIG).some(v=>String(v).includes("PASTE"));
let app,auth,db,me=null,saveTimer=null,saveKey="saved",unsubs=[];
function setSave(k){saveKey=k;$("save").textContent=t()[k]}
function persist(){
  setSave("saving");clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const snapshot=JSON.parse(JSON.stringify(state));
    try{await setDoc(doc(db,"state","main"),stateDoc(snapshot));setSave("saved")}
    catch(e){setSave("saveFail")}
    finally{saveTimer=null}
  },600);
}
function gate(kind,extra){
  const L=t();$("app").hidden=true;$("gate").hidden=false;
  let h="";
  if(kind==="loading")h=`<p>${esc(L.gLoading)}</p>`;
  if(kind==="setup")h=`<h2>${esc(L.gSetupH)}</h2><p>${esc(L.gSetupP)}</p>`;
  if(kind==="signin")h=`<h2>${esc(L.gSignH)}</h2><p>${esc(L.gSignP)}</p><button class="btn" id="gSign" type="button">${esc(L.gSignBtn)}</button><p class="err" id="gErr">${extra?esc(L.gSignErr):""}</p>`;
  if(kind==="denied")h=`<h2>${esc(L.gDeniedH)}</h2><p>${esc(L.gDeniedP(me&&me.email||""))}</p><button class="btn ghost" id="gOut" type="button">${esc(L.signOut)}</button>`;
  if(kind==="import")h=`<h2>${esc(L.gImportH)}</h2><p>${esc(L.gImportP)}</p><button class="btn" id="gImp" type="button">${esc(L.gImportBtn)}</button><p class="err" id="gErr"></p>`;
  $("gateBody").innerHTML=h;gateKind=kind;
  if($("gSign"))$("gSign").onclick=doSignIn;
  if($("gOut"))$("gOut").onclick=()=>signOut(auth);
  if($("gImp"))$("gImp").onclick=()=>{importMode="full";$("impFile").click()};
}
let gateKind="loading";
async function doSignIn(){
  const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{await signInWithPopup(auth,p)}
  catch(e){
    if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"||e.code==="auth/cancelled-popup-request")){try{await signInWithRedirect(auth,p)}catch(e2){gate("signin",true)}}
    else if(e&&e.code!=="auth/popup-closed-by-user")gate("signin",true);
  }
}
function stopListeners(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
function startListeners(){
  stopListeners();
  const denied=e=>{if(e&&e.code==="permission-denied")gate("denied")};
  unsubs.push(onSnapshot(doc(db,"config","plan"),sn=>{
    if(!sn.exists()){gate("import");return}
    const c=sn.data();if(!validConfig(c)){gate("import");return}
    const first=!CFG;setConfig(c);
    if(first){const ci=currentIdx();sel=ci>=0?ci:0;hSel=sel;}
    state=sanitize(state);
    showApp();
  },denied));
  unsubs.push(onSnapshot(doc(db,"state","main"),sn=>{
    if(saveTimer)return;
    rawState=sn.exists()?sn.data():{};
    if(CFG){state=sanitize(rawState);render()}
  },denied));
  unsubs.push(onSnapshot(collection(db,"pantry"),qs=>{
    pantry=qs.docs.map(d=>{const x=d.data()||{};return{id:d.id,name:String(x.name||"").slice(0,40),price:Math.max(0,+x.price||0),sec:SECS.includes(x.sec)?x.sec:"other",prio:[1,2,3].includes(+x.prio)?+x.prio:2,cat:String(x.cat||""),status:["ok","low","out"].includes(x.status)?x.status:"ok",need:!!x.need,checked:!!x.checked}}).filter(p=>p.name);
    if(CFG)render();
  },denied));
  unsubs.push(onSnapshot(collection(db,"purchases"),qs=>{
    purchases=qs.docs.map(d=>{const x=d.data()||{};return{id:d.id,month:Math.round(+x.month),amount:+x.amount,item:String(x.item||"").slice(0,60),date:String(x.date||""),by:String(x.by||""),byName:String(x.byName||""),photo:!!x.photo,cat:String(x.cat||""),created:+x.created||0}})
      .filter(q=>q.month>=0&&q.amount>0);
    if(CFG)render();
  },denied));
}
let rawState={};
function showApp(){
  if(rawState&&CFG)state=sanitize(rawState);
  $("gate").hidden=true;$("app").hidden=false;
  $("who").textContent=t().signedAs(me.email||"");
  applyLang();
}

/* ---------- import / export ---------- */
function backupObj(){
  return {version:1,exported:new Date().toISOString(),config:CFG,state:JSON.parse(JSON.stringify(state)),
    purchases:purchases.map(({id,...q})=>q)};
}
function doExport(){
  const blob=new Blob([JSON.stringify(backupObj(),null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="budget-backup-"+isoToday()+".json";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
const readText=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsText(f)});
let importMode="full";
async function doImport(file){
  const L=t();const errEl=$("gErr")||$("bErr");
  let data;
  try{data=JSON.parse(await readText(file))}catch(e){if(errEl)errEl.textContent=L.gImportErr;return}
  if(!data||!validConfig(data.config)){if(errEl)errEl.textContent=L.gImportErr;return}
  if(importMode==="plan"&&CFG){
    if(!confirm(L.confirmPlan))return;
    try{
      const oldStart=CFG.startYear*12+CFG.startMonth,newStart=data.config.startYear*12+data.config.startMonth;
      const delta=oldStart-newStart;
      const batch=writeBatch(db);
      batch.set(doc(db,"config","plan"),JSON.parse(JSON.stringify(data.config)));
      if(delta!==0){
        const sh=o=>{const n={};for(const k of Object.keys(o||{})){const j=+k+delta;if(j>=0)n[j]=o[k]}return n};
        const st=JSON.parse(JSON.stringify(state));
        st.entries=sh(st.entries);st.overrides=sh(st.overrides);st.houseCats=sh(st.houseCats);
        if(st.raise)st.raise.from=Math.max(0,st.raise.from+delta);

        purchases.forEach(q=>batch.set(doc(db,"purchases",q.id),{month:q.month+delta},{merge:true}));
        sel=Math.max(0,sel+delta);hSel=Math.max(0,hSel+delta);
      }

    catch(e){if(errEl)errEl.textContent=(e&&e.code==="permission-denied")?L.gDeniedH:L.saveFail}
    return;
  }
  if(CFG){if(!confirm(L.confirmImport))return;doExport()}
  const saveCfg=CFG;setConfig(data.config);const st=sanitize(data.state||{});
  try{
    const old=await getDocs(collection(db,"purchases"));
    const batch=writeBatch(db);
    old.docs.forEach(d=>batch.delete(d.ref));
    batch.set(doc(db,"config","plan"),JSON.parse(JSON.stringify(data.config)));
    batch.set(doc(db,"state","main"),stateDoc(st));
    (Array.isArray(data.purchases)?data.purchases:[]).slice(0,400).forEach(q=>{
      const mi=Math.round(+q.month),amt=+q.amount;if(!(mi>=0&&mi<N&&amt>0))return;

    });
    await batch.commit();
    state=st;rawState=st;
    if($("bErr"))$("bErr").textContent=L.imported;
  }catch(e){if(saveCfg)setConfig(saveCfg);if(errEl)errEl.textContent=(e&&e.code==="permission-denied")?L.gDeniedH:L.saveFail}
}

/* ---------- motion helpers ---------- */
const reduceMotion=()=>window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function tween(el,to){
  const from=Number.isFinite(el._v)?el._v:0;el._v=to;
  if(reduceMotion()||from===to||!el.isConnected||el.offsetParent===null){el.textContent=fmt(to);return}
  const t0=performance.now(),dur=700;cancelAnimationFrame(el._raf);
  const step=now=>{const k=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)el._raf=requestAnimationFrame(step)};
  el._raf=requestAnimationFrame(step);
}
let sparkDrawn=false;
function renderSpark(rows){
  const svg=$("spark");if(!svg)return;
  const W=320,H=96,pad=10;
  const vals=rows.map(r=>r.em),plan=BASE_ROWS.map(r=>r.em);
  const all=vals.concat(plan,[0]);const lo=Math.min(...all),hi=Math.max(...all)||1;
  const x=i=>N<2?W/2:8+(i/(N-1))*(W-16);const y=v=>pad+(H-2*pad)*(1-(v-lo)/((hi-lo)||1));
  const xp=i=>document.documentElement.dir==="rtl"?W-x(i):x(i);
  const pts=vals.map((v,i)=>[xp(i),y(v)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("");
  const ppath=plan.map((v,i)=>(i?"L":"M")+xp(i).toFixed(1)+","+y(v).toFixed(1)).join("");
  const area=path+"L"+pts[pts.length-1][0].toFixed(1)+","+H+"L"+pts[0][0].toFixed(1)+","+H+"Z";
  const zy=y(0).toFixed(1);
  svg.innerHTML=`<defs><linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--teal);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--teal);stop-opacity:0"/></linearGradient></defs>`+
    (lo<0?`<line class="zero" x1="0" x2="${W}" y1="${zy}" y2="${zy}"/>`:"")+
    `<path class="area" d="${area}"/><path class="plan" d="${ppath}"/><path class="line" d="${path}" pathLength="1000"/><path class="beam" d="${path}" pathLength="1000"/>`+
    `<line class="cursor" x1="${pts[sel][0].toFixed(1)}" x2="${pts[sel][0].toFixed(1)}" y1="0" y2="${H}"/>`;
  svg.style.setProperty("--len","1000");
  if(!sparkDrawn&&!reduceMotion()&&svg.offsetParent!==null){sparkDrawn=true;svg.classList.remove("draw");void svg.getBoundingClientRect();svg.classList.add("draw");setTimeout(()=>svg.classList.remove("draw"),1500)}
  let dot=svg.parentElement.querySelector(".spark-dot");
  if(!dot){dot=document.createElement("span");dot.className="spark-dot";svg.parentElement.appendChild(dot)}
  dot.style.left=(pts[sel][0]/W*100)+"%";dot.style.top=(pts[sel][1]/H*svg.getBoundingClientRect().height||pts[sel][1])+"px";
  $("sxStart").textContent=M(0);$("sxEnd").textContent=M(N-1);
  $("sxSel").textContent=M(sel);
}
function sparkPick(ev){

  let f=((ev.clientX-r.left)/r.width*320-8)/(320-16);if(document.documentElement.dir==="rtl")f=1-f;

/* ---------- rebalance after overspending ---------- */
let fixK=null,fixSel=null;
function cutPlan(rows,T,K,start){
  const out=[];let left=T;const per=Math.ceil(T/K/50)*50;
  for(let i=start;i<N&&left>0;i++){
    const p=rows[i].personal;if(p<=0)continue;
    const cap=Math.floor(p*0.5/50)*50;const cut=Math.min(per,cap,left);
    if(cut>0){out.push({i,from:p,to:p-cut});left-=cut}
  }
  return {items:out,left};
}
function renderFix(rows,r){
  const L=t(),box=$("mFix");
  if(fixSel!==sel){fixK=null;fixSel=sel}
  const neg=r.em<0,over=(r.overflow+r.emx+r.houseOver)>0;
  const T=BASE_ROWS[N-1].em-rows[N-1].em;
  if(!neg&&!(over&&T>0)){box.innerHTML="";return}
  let h=`<div class="fix"><h3>${esc(L.rebH)}</h3>`;
  if(neg&&sel<N-1){
    const D=-r.em;
    h+=`<p>${esc(L.fixNeg(M(sel),fmt(D)))}</p><button type="button" class="btn ghost" id="fixCard">${esc(L.fixCardBtn(fmt(D),M(sel+1)))}</button><p class="muted">${esc(L.fixCardWhy)}</p>`;
  }
  let plan=null;
  if(T>0){
    h+=`<p>${esc(L.fixLost(fmt(T)))}</p><div class="opts">`+[3,6,12].map(k=>`<button type="button" class="btn ${fixK===k?"":"ghost"}" data-fixk="${k}">${esc(L.fixOver(k))}</button>`).join("")+`</div>`;
    if(fixK){
      plan=cutPlan(rows,T,fixK,sel+1);
      h+=`<p class="muted">${esc(L.fixPreviewH)}</p><table class="ledger fixprev">`+plan.items.map(x=>`<tr><td>${esc(M(x.i))}</td><td><span class="num">${fmt(x.from)} → ${fmt(x.to)}</span></td></tr>`).join("")+`</table>`;
      if(plan.left>0)h+=`<p class="caution">${esc(L.fixLeft(fmt(plan.left)))}</p>`;
      if(plan.items.length)h+=`<div class="opts"><button type="button" class="btn" id="fixApply">${esc(L.fixApply)}</button><button type="button" class="btn link" id="fixCancel">${esc(L.fixCancel)}</button></div>`;
    }
  }
  box.innerHTML=h+`</div>`;
  if($("fixCard"))$("fixCard").onclick=()=>{
    const D=-r.em;const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    (state.entries[sel]=state.entries[sel]||[]).push({id:id(),amount:D,note:L.cardIn,type:"income",source:"personal"});
    (state.entries[sel+1]=state.entries[sel+1]||[]).push({id:id(),amount:D,note:L.cardOut,type:"expense",source:"emergency"});
    persist();render();toast(L.fixDone);
  };
  box.querySelectorAll("[data-fixk]").forEach(b=>b.onclick=()=>{fixK=+b.dataset.fixk;render()});
  if($("fixCancel"))$("fixCancel").onclick=()=>{fixK=null;render()};
  if($("fixApply"))$("fixApply").onclick=()=>{
    for(const x of plan.items){
      const o=state.overrides[x.i]||{};
      if(x.to===planVal(state,x.i,"personal"))delete o.personal;else o.personal=x.to;
      if(Object.keys(o).length)state.overrides[x.i]=o;else delete state.overrides[x.i];
    }
    fixK=null;persist();render();toast(L.fixDone);
  };
}

function recommend(need,left,rows){

  const buy=[],wait=[];let money=left;
  for(const p of order){
    const price=p.price||0;
    if(p.cat&&p.cat in catLeft&&price>catLeft[p.cat]){wait.push({p,why:"cat",n:Math.max(0,catLeft[p.cat]),c:cl.find(c=>c.id===p.cat).name});continue}

async function shrink(file){
  try{
    const url=URL.createObjectURL(file);const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
    const sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.85));
  }catch(e){return file}
}
const toB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)});
let aiMod=null,aiInst=null;
const MODEL_KEY="budget-plan-model";
async function readReceipt(blob){
  if(!aiMod){aiMod=await import("https://www.gstatic.com/firebasejs/12.0.0/firebase-ai.js");aiInst=aiMod.getAI(app,{backend:new aiMod.GoogleAIBackend()})}
  const prompt=`The image is a photo of a shopping receipt or invoice from Egypt. It may be in Arabic or English. Find the final total actually paid, in Egyptian pounds. Reply with only JSON: {"total": number or null, "date": "YYYY-MM-DD" or null, "summary": string}. "summary" says what was bought in at most 5 words, written in ${lang==="ar"?"Egyptian Arabic":"English"}. Use null for any value you cannot read clearly.${(()=>{const cl=catsFor(monthOf($("hDate").value)>=0?monthOf($("hDate").value):hSel).list;return cl.length?` Also add "category": the one name from this list that best fits the purchase, or null: ${JSON.stringify(cl.map(c=>c.name))}.`:""})()}`;
  const part={inlineData:{data:await toB64(blob),mimeType:blob.type||"image/jpeg"}};
  let saved=null;try{saved=localStorage.getItem(MODEL_KEY)}catch(e){}
  const order=saved&&GEMINI_MODELS.includes(saved)?[saved].concat(GEMINI_MODELS.filter(m=>m!==saved)):GEMINI_MODELS;
  let lastErr=null;
  for(const name of order){
    try{
      const model=aiMod.getGenerativeModel(aiInst,{model:name,generationConfig:{responseMimeType:"application/json"}});
      const res=await model.generateContent([prompt,part]);
      const txt=res.response.text().replace(/```json|```/g,"").trim();
      try{localStorage.setItem(MODEL_KEY,name)}catch(e){}
      return JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1));
    }catch(e){
      lastErr=e;const m=String(e&&e.message||"");
      if(/404|not found|not supported|retired|unknown model|NOT_FOUND/i.test(m))continue;
      throw e;
    }
  }
  throw lastErr||new Error("no model");
}
function errText(e){const c=e&&(e.code||e.status)||"";const m=String(e&&e.message||e||"").replace(/\s+/g," ").slice(0,160);return(c?c+": ":"")+m}
$("hPhotoBtn").onclick=()=>$("hPhoto").click();
/* on-device fallback: read only the total with OCR when Gemini fails */
let tessLoading=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  if(!tessLoading)tessLoading=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});
  return tessLoading;
}
function normDigits(x){return x.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g,".").replace(/٬/g,",")}
function nums(line){
  const out=[];const re=/\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?/g;let m;
  while((m=re.exec(line))){const v=parseFloat(m[0].replace(/,/g,""));if(v>0&&v<500000&&m[0].replace(/[,.]/g,"").length<=8)out.push(v)}
  return out;
}
function findTotal(text){
  const lines=normDigits(text).split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const strong=/(grand\s*total|net\s*total|total\s*due|amount\s*due|to\s*pay|الصافي|صافى|صافي|المطلوب|الاجمالي\s*النهائي|الإجمالي\s*النهائي|المستحق)/i;
  const weak=/(total|الإجمالي|الاجمالي|اجمالي|إجمالي|الاجمالى|اجمالى|الإجمالى|المجموع|جملة|الجملة)/i;
  const sub=/(sub\s*-?\s*total|الفرعي|فرعي|قبل|vat|tax|ضريبة|خصم|discount|change|الباقي|نقدي|cash|paid)/i;
  const pick=rx=>{let best=null;lines.forEach((ln,k)=>{if(!rx.test(ln)||sub.test(ln))return;let c=nums(ln);if(!c.length&&lines[k+1])c=nums(lines[k+1]);if(c.length){const v=Math.max(...c);if(best===null||v>=best)best=v}});return best};
  return pick(strong)??pick(weak);
}
async function ocrTotal(blob){
  await loadTesseract();
  const w=await window.Tesseract.createWorker(["ara","eng"]);
  try{const r=await w.recognize(blob);return findTotal(r.data.text||"")}finally{try{await w.terminate()}catch(e){}}
}
$("hPhoto").onchange=async()=>{
  const f=$("hPhoto").files&&$("hPhoto").files[0];$("hPhoto").value="";if(!f)return;
  const L=t(),msg=$("hPhotoMsg");
  msg.textContent=L.hReading;$("hPhotoBtn").disabled=true;
  let blob=null,why="";
  try{
    blob=await shrink(f);
    const res=await readReceipt(blob);
    const tot=res&&+res.total;
    if(res&&typeof res.summary==="string"&&res.summary.trim())$("hItem").value=res.summary.trim().slice(0,60);
    if(res&&monthOf(res.date)>=0)$("hDate").value=res.date;

    msg.textContent=L.hReadFail+(why?" ("+why+")":"");
  }catch(e){console.error(e);msg.textContent=L.hReadFail+(why?" ("+why+")":"")}
  finally{$("hPhotoBtn").disabled=false}
};

const ACC={teal:["#0e6b6b","#e2f0ef","#5cc2bd","#16302f"],blue:["#1f5fae","#e3ecf8","#7fb0f0","#172a44"],violet:["#6a3fa8","#efe8f8","#b79af0","#2a1f40"],green:["#2f7a3e","#e4f2e6","#82cf8f","#1a3320"],rose:["#b0305c","#f9e4ec","#f08fb1","#3d1a28"]};

const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function applyTheme(){
  const root=document.documentElement;
  if(theme.mode==="auto")root.removeAttribute("data-theme");else root.setAttribute("data-theme",theme.mode);
  const dark=theme.mode==="dark"||(theme.mode==="auto"&&mq&&mq.matches);

  root.style.setProperty("--teal",dark?a[2]:a[0]);root.style.setProperty("--teal-soft",dark?a[3]:a[1]);root.style.setProperty("--accent-hi",a[2]);

  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=getComputedStyle(root).getPropertyValue("--paper").trim();

}
